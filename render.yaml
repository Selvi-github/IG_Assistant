services:
  - type: web
    name: ig-assistant
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm run install:all && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: HF_TOKEN
        sync: false
      - key: POLLINATIONS_API_KEY
        sync: false

